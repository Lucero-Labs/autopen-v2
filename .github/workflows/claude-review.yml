# A second reader, because this repo has one author and everything in it is
# merged by the person who wrote it. It covers the half of STYLES that Biome
# cannot mechanise — §6.2 fail-closed, §8.1 never-log, §0.6 where a fix belongs
# — and STYLES §Scope already instructs any bot reviewing this repo to apply
# every rule and flag deviations even when the change is otherwise correct.
name: Claude Review

on:
  pull_request:
    types: [opened, ready_for_review]

jobs:
  review:
    name: review
    # A draft is a work in progress; reviewing one spends tokens on a diff its
    # author has not finished arguing with.
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Review
        uses: anthropics/claude-code-action@0d0e0876d3eaa933f45dc692f7a4312c83caf36f # v1.0.218
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: |
            /code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }} --comment

            Two checks this repository needs that a general review misses:

            Grep the diff for the STYLES §8.1 never-log list — API key, clientToken,
            OTP, DNI, sexo, PIN, PDF bytes, biometric evidence, JWTs — including in
            test fixtures and example payloads. This is a vendor hard rule, not a
            preference, and a DNI is about to enter session-creation payloads.

            Check every vendor claim against docs/vendor/lakaut/, which is a mirror
            pinned at SDK 0.1.0-rc.40 and is the citation source. A claim about
            Lakaut paraphrased from RESULT-001, from a design document, or from
            memory is a finding even when it happens to be correct — a wrong
            paraphrase has already shipped in this repo once.
          claude_args: "--model claude-fable-5-1 --effort max --dangerously-skip-permissions"

<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Firma del documento</title>
    <style>
      /* Deliberately bare. The Hosted UI iframe is a fixed 810px tall, so the
         page gives it the full width, at least that height, and nothing that
         could clip it: no overflow: hidden, no transform, nothing sticky or
         fixed. The page scrolls as a whole
         (docs/vendor/lakaut/sdk-integracion__frontend-hosted-ui.md,
         "Tamaño y responsive"). */
      :root {
        color-scheme: light;
        font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
      }
      body {
        margin: 0;
        background: #fff;
        color: #1a1a19;
      }
      #status {
        margin: 0;
        padding: 0.75rem 1rem;
        font-size: 1rem;
      }
      #detail {
        margin: 0;
        padding: 0 1rem 0.75rem;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.75rem;
        color: #4a4a46;
        white-space: pre-wrap;
      }
      #detail.fault {
        color: #a1321f;
      }
      #retry {
        margin: 0 1rem 0.75rem;
        font: inherit;
        padding: 0.45rem 1rem;
        border: 0;
        border-radius: 5px;
        background: #1a1a19;
        color: #fff;
        cursor: pointer;
      }
      #lakaut-hosted-ui {
        width: 100%;
        min-width: 0;
        min-height: 810px;
      }
    </style>
  </head>
  <body>
    <p id="status">Preparando la firma…</p>
    <p id="detail"></p>
    <button type="button" id="retry" hidden>Reintentar</button>
    <div id="lakaut-hosted-ui"></div>

    <script type="module" src="/sign.js"></script>
  </body>
</html>

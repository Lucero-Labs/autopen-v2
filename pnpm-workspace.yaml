packages:
  - "packages/*"
  - "apps/*"

# Fail the install when Node is outside the `engines` range, instead of warning
# and failing later with a confusing module or syntax error.
engineStrict: true

# Resolve a dependency to the workspace copy when one satisfies the range.
preferWorkspacePackages: true

autoInstallPeers: true

# Single source for versions used by more than one package. Referenced as
# `"typescript": "catalog:"`.
catalog:
  "@types/node": 22.18.1
  typescript: 5.9.3
  vitest: 4.1.11

# pnpm 10 runs no dependency lifecycle script unless it is listed here.
# lefthook's postinstall runs `lefthook install`, wiring lefthook.yml into
# .git/hooks; it skips itself when CI=true, so CI gains no hooks from it.
onlyBuiltDependencies:
  - lefthook
